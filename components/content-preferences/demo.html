<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea to Content · Prototype</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main>
    <header><h1>Idea to Content</h1><span class="badge">Prototype</span></header>
    <section class="panel" aria-label="Content request">
      <label for="topic">Brief</label>
      <textarea id="topic" rows="3">Write a 45-second video script about how to get good at public speaking, for beginners.</textarea>
      <content-preferences scope-label="Current brief" action-label="Generate content"></content-preferences>
    </section>
    <p class="note" id="model-info">Loading model settings…</p>
    <section class="request panel" hidden id="request">
      <h2>Your content</h2>
      <p id="request-info" role="status" aria-live="polite"></p>
      <div class="request-actions">
        <button id="cancel" type="button" hidden>Cancel generation</button>
        <button id="retry" type="button" hidden>Try again</button>
      </div>
      <div id="results"></div>
      <p role="status" id="copy-status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="./demo.mjs"></script>
</body>
</html>

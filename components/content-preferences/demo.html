<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea to Content · Prototype</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main>
    <header><h1>Idea to Content</h1><span class="badge">Prototype</span></header>
    <section class="panel" aria-label="Content request">
      <label for="topic">Brief</label>
      <textarea id="topic" rows="3">Write a 45-second video script about how to get good at public speaking, for beginners.</textarea>
      <content-preferences scope-label="Current brief"></content-preferences>
    </section>
    <p class="note">Preview only · Hermes not connected</p>
    <section class="request panel" hidden id="request">
      <h2>Request prepared</h2>
      <p id="request-info"></p>
      <pre id="prompt"></pre>
      <button id="copy" type="button">Copy Hermes prompt</button>
      <p role="status" id="copy-status"></p>
    </section>
  </main>
  <script type="module" src="./demo.mjs"></script>
</body>
</html>
